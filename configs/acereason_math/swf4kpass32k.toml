max_steps = 10

[trainer]
sw = 4096
n_update = 4096

[trainer.model]
seq_len = 32768

[model]
name = "ryzax/x"

[ckpt]
interval = 100

[wandb]
project = "acereason-math"
name = "stage1"

[orchestrator]
batch_size = 64
rollouts_per_example = 8
seq_len = 32768
n_update = 4096
n_update_multiplier = 8

[orchestrator.sampling]
temperature = 0.6
max_tokens = 32768

[[orchestrator.env]]
id = "math-env"
args = { dataset_name = "nvidia/AceReason-Math", dataset_subset = "default", question_key = "problem", math_verify_max_workers = 128, math_verify_timeout = 60 }

[inference]
compilation_config = {cudagraph_mode="PIECEWISE"}
